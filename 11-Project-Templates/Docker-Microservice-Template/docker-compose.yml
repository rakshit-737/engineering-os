services:
  worker:
    build: .
    restart: unless-stopped
    stop_grace_period: 30s
    environment:
      LOG_LEVEL: INFO
      POLL_INTERVAL_SECONDS: "2"
    deploy:
      resources:
        limits:
          memory: 256M
