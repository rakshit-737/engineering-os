name: Bug report
description: Something in the app or content is broken
labels: [bug]
body:
  - type: textarea
    id: what
    attributes: { label: What happened?, description: Include the URL/route and steps to reproduce. }
    validations: { required: true }
  - type: textarea
    id: expected
    attributes: { label: Expected behavior }
  - type: input
    id: env
    attributes: { label: Browser / device }
